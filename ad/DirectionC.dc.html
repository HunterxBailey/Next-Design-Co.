<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;900&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif; }
    a { color: #FFFFFF; } a:hover { color: #D6EFD6; }
  </style>
</helmet>
<div style="width: 1080px; height: 1080px; box-sizing: border-box; background: {{accentDeep}}; color: #FFFFFF; padding: 68px; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 20px;">
    <span style="font-size: 19px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700; color: {{accentSoft}};">Renee&#39;s Realty Network</span>
    <div style="width: 178px; height: 54px; flex-shrink: 0; border: 1px dashed rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.75);">[ BHGRE logo ]</span>
    </div>
  </div>

  <h1 style="margin: 46px 0 0; flex-shrink: 0; font-size: 116px; font-weight: 900; line-height: 0.98; letter-spacing: -0.035em; text-transform: uppercase; color: #FFFFFF;">Any house<br>in Maine.<br><span style="color: {{accentSoft}};">One team.</span></h1>

  <div style="flex-grow: 1; min-height: 36px;"></div>

  <div style="flex-shrink: 0; background: #FFFFFF; color: {{accentDeep}}; padding: 32px 44px; display: flex; align-items: center; justify-content: space-between; gap: 28px;">
    <span style="font-size: 27px; font-weight: 600;">Call or text</span>
    <span style="font-size: 50px; font-weight: 900; letter-spacing: -0.02em;">(207) 782-8311</span>
  </div>

  <div style="margin-top: 32px; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 30px;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 44px; font-weight: 700; letter-spacing: -0.02em;">Renee Roy, REALTOR&#174;</div>
      <div style="font-size: 21px; line-height: 1.45; color: rgba(255,255,255,0.86);">Better Homes and Gardens Real Estate<br>The Masiello Group &#183; 155 Center Street, Auburn</div>
    </div>
    <div style="text-align: right; font-size: 18px; line-height: 1.6; color: rgba(255,255,255,0.86);">reneeroy@masiello.com<br>Maine Lic. [LICENSE #]<br>Equal Housing Opportunity</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#339933","options":["#339933","#2F7D32","#4A7C59","#33668F"]},"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  mix(hex, to, t) {
    if (!/^#[0-9a-fA-F]{6}$/.test(hex || '')) return null;
    const read = (h, i) => parseInt(h.slice(i, i + 2), 16);
    const from = [read(hex, 1), read(hex, 3), read(hex, 5)];
    const out = from.map((v, i) => Math.round(v + (to[i] - v) * t));
    return '#' + out.map((v) => v.toString(16).padStart(2, '0')).join('');
  }
  renderVals() {
    const accent = this.props.accent ?? '#339933';
    return {
      accent: accent,
      accentDeep: this.mix(accent, [0, 0, 0], 0.36) ?? '#215F21',
      accentSoft: this.mix(accent, [255, 255, 255], 0.6) ?? '#ADDCAD'
    };
  }
}
</script>
</body>
</html>
